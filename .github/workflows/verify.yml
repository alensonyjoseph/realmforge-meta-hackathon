name: Verify REALMFORGE LIVE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify all application modules
        run: |
          for f in app.js live.js tracker.js effects.js api/*.js lib/*.js; do node --check "$f"; done
      - name: Run deterministic tests with mocked Meta responses
        run: node --test test/*.test.mjs
